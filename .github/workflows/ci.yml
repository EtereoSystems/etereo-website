name: CI

# Runs on every PR, and on main so the branch always has a green commit to compare
# against. `verify` is the job name to require as a status check in branch protection.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The error that prompted this workflow surfaced only here: `tsc -b` covers the
      # sources, but Vite's own resolution and the postbuild CSS inlining do not run
      # until a real build. Same env the deploy uses, so the output matches.
      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://www.etereosystems.com
